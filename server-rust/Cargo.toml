[package]
name = "pairdrop-server"
version = "1.11.2"
edition = "2021"
description = "PairDrop signaling server in Rust"
license = "GPL-3.0"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha3 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

# User agent parsing
woothee = "0.13"

# Utilities
url = "2"
hex = "0.4"
once_cell = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
futures = "0.3"
tokio-stream = "0.1"
